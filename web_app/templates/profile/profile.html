<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('profile.page_title') }}</title>
    <link rel="stylesheet" href="/static/shared/styles.css?v=7">
    <link rel="stylesheet" href="/static/profile/profile.css?v=8">
    <link rel="stylesheet" href="/static/review/review.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="with-site-nav">
    {% include 'shared/site_nav.html' %}
    <main class="app-container profile-container">
        <div class="profile-topbar">
            <a href="/" class="profile-link">&larr; {{ t('profile.dashboard') }}</a>
        </div>

        <section class="profile-header">
            <div class="profile-header-main">
                <button type="button" id="avatar-trigger" class="profile-avatar-wrap" title="{{ t('profile.upload_avatar') }}">
                    <img id="profile-avatar-img" class="profile-avatar-img" alt="" style="display:none;">
                    <div id="profile-avatar-fallback" class="profile-avatar-fallback">{{ current_user.username[:1]|upper }}</div>
                    <span class="profile-avatar-overlay"><i class="fa-solid fa-camera" aria-hidden="true"></i></span>
                </button>
                <div class="profile-heading">
                    <h1>{{ current_user.username }}</h1>
                    <p>{{ current_user.email }}</p>
                </div>
            </div>
            <div class="profile-badge-col">
                <img class="profile-badge-img" src="{{ badge_url(current_user.level) }}" alt="{{ t('profile.badge') }} HSK {{ current_user.level }}">
            </div>
        </section>

        <div id="avatar-modal" class="profile-modal" hidden>
            <div class="profile-modal-backdrop" data-avatar-close></div>
            <div class="profile-modal-box" role="dialog" aria-modal="true" aria-labelledby="avatar-modal-title">
                <div class="profile-modal-head">
                    <h2 id="avatar-modal-title">{{ t('profile.upload_avatar') }}</h2>
                    <button type="button" class="profile-modal-close" data-avatar-close aria-label="{{ t('widgets.close') }}">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <form id="avatar-form" class="avatar-form" enctype="multipart/form-data">
                    <input id="avatar-input" name="avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
                    <button class="btn primary avatar-submit" type="submit">{{ t('profile.upload_avatar') }}</button>
                </form>
                <div id="avatar-message" class="profile-message"></div>
            </div>
        </div>

        <section class="profile-section">
            <h2>{{ t('profile.review_practices') }}</h2>
            {% include 'review/_review_panel.html' %}
        </section>

        <section class="profile-section">
            <h2>{{ t('profile.change_password') }}</h2>
            <form id="password-form" class="password-form">
                <div class="form-group">
                    <label for="new-password">{{ t('profile.new_password_label') }}</label>
                    <input id="new-password" name="new_password" type="password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">{{ t('profile.confirm_password_label') }}</label>
                    <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
                </div>
                <button class="btn primary password-submit" type="submit">{{ t('profile.change_password') }}</button>
            </form>
            <div id="password-message" class="profile-message"></div>
        </section>
    </main>

    <script src="/static/profile/profile.js?v=4"></script>
    <script src="/static/review/review.js?v=4"></script>
</body>
</html>
